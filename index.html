<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Archive Map</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <div class="hud-panel hud-top-left">
        <div id="hud-coords">N --° --' --" / E --° --' --"</div>
        <div id="hud-datetime">YYYY/MM/DD --:--</div>
    </div>

    <div class="hud-panel hud-bottom-left" id="hud-location">
        SELECT A CLOUD MEMORY
    </div>

    <div class="hud-panel hud-bottom-right">
        <div class="energy-title">EMOTION INDEX</div>
        <div class="energy-scale-bar">
            <div class="energy-fill-track" id="hud-energy-track"></div>
        </div>
        <div class="energy-labels">
            <span>0</span>
            <span id="hud-energy-value">--</span>
            <span>100</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
